<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:bold;fill:#1b1f24}
      .s{font-size:12.5px;fill:#1b1f24}
      .m{font-size:11.5px;fill:#5b6470}
      .bad{font-size:12px;fill:#c0392b;font-weight:bold}
      .lbl{font-size:12px;fill:#c0392b}
      .glbl{font-size:12px;fill:#5b6470}
    </style>
  </defs>

  <rect width="1400" height="950" fill="#ffffff"/>
  <text x="700" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#15402e">Azure ScoutSuite Insecure Lab — Architecture</text>
  <text x="700" y="58" text-anchor="middle" class="m">Red = misconfiguration deliberately deployed · F1 Identity · F2 Data · F3 Network</text>

  <!-- Internet -->
  <rect x="30" y="330" width="170" height="210" rx="14" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="115" y="365" text-anchor="middle" class="t">Internet</text>
  <text x="115" y="385" text-anchor="middle" class="m">(any source IP)</text>
  <circle cx="115" cy="440" r="30" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="115" y="447" text-anchor="middle" font-size="22">☠</text>
  <text x="115" y="500" text-anchor="middle" class="s">Anonymous</text>
  <text x="115" y="517" text-anchor="middle" class="s">attacker</text>

  <!-- Tenant -->
  <rect x="240" y="80" width="1130" height="790" rx="16" fill="#f4f8fc" stroke="#0b5cad" stroke-width="2"/>
  <text x="260" y="108" class="t" fill="#0b5cad">Microsoft Entra ID Tenant</text>

  <!-- User -->
  <rect x="270" y="125" width="300" height="120" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="290" y="150" class="t">👤 User: lab.operator</text>
  <text x="290" y="172" class="s">Password sign-in, no MFA / CA policy</text>
  <text x="290" y="194" class="bad">Role: custom-subscription-owner</text>
  <text x="290" y="212" class="bad">Actions = ["*"] @ subscription</text>
  <circle cx="548" cy="146" r="15" fill="#c0392b"/><text x="548" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">F1</text>

  <!-- ScoutSuite -->
  <rect x="1040" y="125" width="300" height="100" rx="10" fill="#e8f0ec" stroke="#15402e" stroke-width="2"/>
  <text x="1060" y="152" class="t" fill="#15402e">🔎 ScoutSuite (Cloud Shell)</text>
  <text x="1060" y="174" class="s">scout azure --cli</text>
  <text x="1060" y="194" class="m">Reader + Security Reader +</text>
  <text x="1060" y="211" class="m">Entra Global Reader (read-only)</text>

  <!-- Subscription -->
  <rect x="270" y="265" width="1080" height="585" rx="14" fill="#fbf7ee" stroke="#d68910" stroke-width="2"/>
  <text x="290" y="292" class="t" fill="#9a6200">Subscription (Azure for Students / Pay-As-You-Go)</text>

  <!-- RG -->
  <rect x="300" y="310" width="1025" height="520" rx="12" fill="#ffffff" stroke="#7a7f87" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="320" y="337" class="t">Resource Group: rg-scoutlab</text>

  <!-- VNet -->
  <rect x="330" y="355" width="560" height="450" rx="12" fill="#eef6ff" stroke="#0b5cad" stroke-width="2"/>
  <text x="350" y="382" class="t" fill="#0b5cad">VNet: vnet-scoutlab (10.10.0.0/16)</text>

  <!-- Subnet -->
  <rect x="360" y="400" width="500" height="385" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="1.5"/>
  <text x="380" y="426" class="t">Subnet: snet-web (10.10.1.0/24)</text>

  <!-- NSG -->
  <rect x="380" y="445" width="460" height="95" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="470" class="t">🛡 NSG: nsg-scoutlab-web</text>
  <text x="400" y="494" class="bad">Allow TCP 22  (SSH)  from * / Internet</text>
  <text x="400" y="514" class="bad">Allow TCP 3389 (RDP) from * / Internet</text>
  <circle cx="818" cy="466" r="15" fill="#c0392b"/><text x="818" y="471" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">F3</text>

  <!-- VM -->
  <rect x="380" y="565" width="460" height="200" rx="8" fill="#ffffff" stroke="#1b1f24" stroke-width="2"/>
  <text x="400" y="592" class="t">🖥 VM: vm-scoutlab-web (Ubuntu 22.04)</text>
  <text x="400" y="616" class="s">Public IP: pip-scoutlab-vm (Static)</text>
  <text x="400" y="638" class="bad">Password authentication enabled</text>
  <text x="400" y="660" class="s">System-assigned Managed Identity:</text>
  <text x="400" y="682" class="bad">• Contributor on rg-scoutlab</text>
  <text x="400" y="704" class="bad">• Storage Blob Data Contributor</text>
  <text x="400" y="736" class="m">IMDS 169.254.169.254 issues MI tokens to</text>
  <text x="400" y="752" class="m">anyone with a shell on the VM</text>

  <!-- Storage -->
  <rect x="950" y="440" width="350" height="325" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="970" y="467" class="t">🗄 Storage: stscoutlab&lt;rand&gt;</text>
  <text x="970" y="492" class="bad">Secure transfer (HTTPS) disabled</text>
  <text x="970" y="512" class="bad">Public network access: all networks</text>
  <text x="970" y="532" class="bad">Anonymous blob access allowed</text>
  <text x="970" y="552" class="bad">Shared-key auth enabled</text>
  <rect x="970" y="575" width="310" height="110" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="985" y="600" class="t">📦 Container: customer-exports</text>
  <text x="985" y="622" class="bad">Access level: Container (anon list+read)</text>
  <text x="985" y="646" class="s">customer_records_FAKE.csv</text>
  <text x="985" y="666" class="m">(synthetic PII)</text>
  <circle cx="1278" cy="462" r="15" fill="#c0392b"/><text x="1278" y="467" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">F2</text>
  <text x="970" y="715" class="m">Outside the VNet — no private endpoint,</text>
  <text x="970" y="733" class="m">reachable on the public blob endpoint</text>

  <!-- Arrows: Internet -> NSG/VM -->
  <path d="M200,470 C260,470 300,492 378,492" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="115" y="300" text-anchor="middle" class="lbl">SSH / RDP brute force</text><text x="115" y="316" text-anchor="middle" class="lbl">→ public IP of VM</text>
  <path d="M200,500 C270,520 300,600 378,610" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Internet -> storage (anonymous) going under the boxes -->
  <path d="M115,540 L115,900 L1270,900 L1270,768" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arr)"/>
  <text x="400" y="925" class="lbl">anonymous HTTP GET  ?restype=container&amp;comp=list  → download blob</text>

  <!-- VM MI -> storage -->
  <path d="M840,690 C890,690 900,630 968,630" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="950" y="425" class="lbl">VM managed-identity token → blob read/write/delete</text>
  

  <!-- User -> subscription -->
  <path d="M420,245 L420,276" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="430" y="262" class="lbl">full control of every resource</text>

  <!-- ScoutSuite read -->
  <path d="M1190,225 L1190,276" fill="none" stroke="#5b6470" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
  <text x="1180" y="256" text-anchor="end" class="glbl">read-only scan (ARM + Graph)</text>
</svg>
